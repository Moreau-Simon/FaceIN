# CI FaceIN — couvre l'ensemble du projet, fonctionne sur TOUTES les branches
#
# Résolution du conflit Modification_python-ci vs develop :
# on garde la CI complète (côté branche) et on SUPPRIME l'ancienne version
# mono-job (côté develop, entre ======= et >>>>>>>).
#
# Pour que cette CI fonctionne aussi sur develop/main (où api/ et circuits/
# n'existent pas encore), les jobs sont adaptatifs :
# - un job "detect" identifie les composants présents dans le commit ;
# - tests-api, circuits et les health checks API/frontend sont ignorés
#   automatiquement si les dossiers absents ;
# - le job docker compte les services réellement déclarés dans le compose
#   (3 noeuds sur develop, 5 services avec l'API et le frontend sur la branche
#   complète).
#
# Non couvert volontairement :
# - lab_ia/       : prototypes ML exploratoires (dépendances non épinglées, modèles lourds)
# - partner-demo/ : démo statique, rien à tester automatiquement
# - frontend/     : statique, validé via le health check HTTP du job docker

name: FaceIN CI

on:
  push:
    branches: [ "main", "develop" ]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Détection des composants présents dans le commit
  # (api/ et circuits/ n'existent que sur les branches "projet complet")
  # ---------------------------------------------------------------------------
  detect:
    name: Détection des composants
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      api: ${{ steps.composants.outputs.api }}
      circuits: ${{ steps.composants.outputs.circuits }}
    steps:
      - uses: actions/checkout@v4

      - name: Identifier les dossiers présents
        id: composants
        run: |
          if [ -d api ]; then echo "api=true" >> "$GITHUB_OUTPUT"; else echo "api=false" >> "$GITHUB_OUTPUT"; fi
          if [ -d circuits ]; then echo "circuits=true" >> "$GITHUB_OUTPUT"; else echo "circuits=false" >> "$GITHUB_OUTPUT"; fi

  # ---------------------------------------------------------------------------
  # Lint : erreurs bloquantes uniquement (E9,F63,F7,F82), rapide
  # ---------------------------------------------------------------------------
  lint:
    name: Lint flake8
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer flake8
        run: pip install flake8

      - name: Lint (erreurs bloquantes)
        run: |
          cibles="nodes"
          if [ -d api ]; then cibles="nodes api"; fi
          flake8 $cibles --count --select=E9,F63,F7,F82 --show-source --statistics

  # ---------------------------------------------------------------------------
  # Tests des noeuds gRPC (partie réseau, présente sur toutes les branches)
  # ---------------------------------------------------------------------------
  tests-noeuds:
    name: Tests noeuds gRPC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # version de l'image Docker de prod (python:3.12-slim)
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r nodes/node/requirements.txt pytest pytest-cov

      - name: Générer le code protobuf
        run: |
          python -m grpc_tools.protoc \
            -I nodes/shared/proto \
            --python_out=nodes/node \
            --grpc_python_out=nodes/node \
            nodes/shared/proto/*.proto

      - name: Lancer les tests
        env:
          PYTHONPATH: ${{ github.workspace }}/nodes/node
        run: |
          mkdir -p reports
          python -m pytest nodes/node/tests -v \
            --junitxml=reports/junit-noeuds.xml \
            --cov=nodes/node \
            --cov-report=term-missing

      - name: Conserver les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-noeuds
          path: reports/

  # ---------------------------------------------------------------------------
  # Tests de l'API Gateway (FastAPI) — uniquement si api/ est présent
  # ---------------------------------------------------------------------------
  tests-api:
    name: Tests API Gateway
    if: needs.detect.outputs.api == 'true'
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest

      # Même génération que le Dockerfile de l'API : grpc_bridge importe
      # verification_pb2 / verification_pb2_grpc
      - name: Générer le code protobuf
        run: |
          python -m grpc_tools.protoc \
            -I nodes/shared/proto \
            --python_out=api \
            --grpc_python_out=api \
            nodes/shared/proto/verification.proto

      - name: Lancer les tests
        run: python -m pytest api/tests -v

  # ---------------------------------------------------------------------------
  # Circuit ZKP — uniquement si circuits/ est présent
  # ---------------------------------------------------------------------------
  circuits:
    name: Circuit ZKP (Circom + Groth16)
    if: needs.detect.outputs.circuits == 'true'
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: circuits/package-lock.json

      - name: Installer circom
        run: |
          curl -fsSL -o /usr/local/bin/circom \
            https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64 \
            || curl -fsSL -o /usr/local/bin/circom \
            https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64
          chmod +x /usr/local/bin/circom
          circom --version

      - name: Installer les dépendances npm
        working-directory: circuits
        run: npm ci

      - name: Compiler le circuit + setup Groth16
        working-directory: circuits
        run: ./build.sh

      - name: Tests du circuit (preuve valide + rejet imposteur)
        working-directory: circuits
        run: npm test

      # Le Dockerfile de l'API copie circuits/build/verification_key.json :
      # on le transmet au job docker sous forme d'artefact.
      - name: Exporter la clé de vérification
        uses: actions/upload-artifact@v4
        with:
          name: verification-key
          path: circuits/build/verification_key.json

  # ---------------------------------------------------------------------------
  # Stack Docker déclarée dans docker-compose.yml + health checks adaptatifs
  # (3 noeuds sur develop, 5 services avec l'API et le frontend sur la branche
  # complète)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker — stack compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect, circuits]
    # Toujours évaluer, même si circuits est ignoré (dossier absent) :
    # on ne saute docker que si circuits a réellement échoué.
    if: ${{ always() && needs.detect.result == 'success' && needs.circuits.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4

      # Clé de vérification ZKP : nécessaire au build de l'image API uniquement
      - name: Récupérer la clé de vérification du circuit
        if: needs.detect.outputs.api == 'true'
        uses: actions/download-artifact@v4
        with:
          name: verification-key
          path: circuits/build

      - name: Valider docker-compose.yml
        run: docker compose config --quiet

      - name: Construire et démarrer la stack
        run: docker compose up -d --build

      - name: Health checks
        run: |
          services=$(docker compose config --services | sort -u)

          # --- API Gateway (FastAPI, port 8000) — si présente ---
          if echo "$services" | grep -q '^api$'; then
            api_ok=0
            for tentative in $(seq 1 12); do
              if curl -fsS http://localhost:8000/api/health | grep -q "en_ligne"; then
                api_ok=1
                break
              fi
              sleep 5
            done
            if [ "$api_ok" -ne 1 ]; then
              echo "::error::Health check de l'API échoué après 60 s."
              docker compose logs api
              exit 1
            fi
            echo "API en ligne."
          fi

          # --- Frontend (serveur HTTP statique, port 3000) — si présent ---
          if echo "$services" | grep -q '^frontend$'; then
            front_ok=0
            for tentative in $(seq 1 6); do
              if curl -fsS -o /dev/null http://localhost:3000/; then
                front_ok=1
                break
              fi
              sleep 5
            done
            if [ "$front_ok" -ne 1 ]; then
              echo "::error::Frontend inaccessible sur le port 3000."
              docker compose logs frontend
              exit 1
            fi
            echo "Frontend en ligne."
          fi

          # --- Tous les services déclarés doivent être actifs ---
          attendus=$(echo "$services" | wc -l)
          actifs=$(docker compose ps --status running --services | sort -u | wc -l)
          if [ "$actifs" -ne "$attendus" ]; then
            echo "::error::Conteneurs actifs : $actifs/$attendus."
            docker compose ps
            docker compose logs
            exit 1
          fi
          echo "Les $attendus services tournent."

      - name: Arrêter et nettoyer
        if: always()
        run: docker compose down -v --remove-orphans