name: Python CI
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest grpcio-tools
        if [ -f nodes/node/requirements.txt ]; then pip install -r nodes/node/requirements.txt; fi
        
    - name: Generate files (Proto)
      run: |
        python -m grpc_tools.protoc -I nodes/shared/proto --python_out=nodes/node --grpc_python_out=nodes/node nodes/shared/proto/verification.proto nodes/shared/proto/sync.proto nodes/shared/proto/revocation.proto nodes/shared/proto/consensus.proto
        
    - name: Lint
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Test
      env:
        PYTHONPATH: ${{ github.workspace }}/nodes/node
      run: |
        python -m pytest nodes/node/tests
