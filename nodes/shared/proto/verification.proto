syntax = "proto3";

package verification;

// Service exposé par chaque noeud pour vérifier une authentification biométrique ZKP
service VerificationService {
  // Récupère l'engagement cryptographique (Poseidon) associé à un utilisateur,
  // nécessaire côté client pour initialiser et vérifier la preuve ZKP.
  // Nom de méthode conservé pour compatibilité ascendante.
  rpc RecupererDonneeAide (DemandeDonneeAide) returns (ReponseDonneeAide);

  // Demande un nonce anti-rejeu juste avant l'envoi de la preuve ZKP (challenge-response)
  rpc DemanderNonce (DemandeNonce) returns (ReponseNonce);

  // Envoie la preuve ZKP Groth16 et les signaux publics générés côté client pour vérification
  rpc VerifierPreuve (DemandeVerification) returns (ReponseVerification);

  // Enregistre ou met à jour un engagement de référence (propagation depuis l'API Gateway)
  rpc EnregistrerEngagement (DemandeEnregistrementEngagement) returns (ReponseEnregistrementEngagement);

  // Révoque un engagement de référence (propagation depuis l'API Gateway)
  rpc RevoquerEngagement (DemandeRevocationEngagement) returns (ReponseRevocationEngagement);

  // Synchronise un lot d'engagements (rattrapage de nœud post-redémarrage)
  rpc SynchroniserEngagements (DemandeSyncEngagements) returns (ReponseSyncEngagements);
}

// Demande de récupération de l'engagement de référence (nom conservé pour rétro-compatibilité)
message DemandeDonneeAide {
  string utilisateur_id = 1;
}

// Réponse contenant l'engagement cryptographique de référence de l'utilisateur
message ReponseDonneeAide {
  bool trouve = 1;
  string donnee_aide = 2;        // Engagement cryptographique de l'utilisateur (hachage Poseidon du vecteur de référence)
  string parametres_extraction = 3; // Métadonnées d'extraction ou de circuit additionnelles
}

// Demande d'un nonce éphémère anti-rejeu 256 bits (challenge-response)
message DemandeNonce {
  string utilisateur_id = 1;
  // Identifiant du service demandeur (ex: "facein-web", "facein-mobile").
  // Le nonce est lié à ce service : il ne peut pas être réutilisé pour un autre.
  string service_cible = 2;
}

// Réponse contenant le nonce 256 bits généré par le nœud
message ReponseNonce {
  // Nonce aléatoire 256 bits encodé en hexadécimal (64 caractères).
  // Format : exactement 64 caractères [0-9a-f] en minuscules.
  string nonce = 1;
  // Timestamp d'expiration en millisecondes (epoch Unix). Validité : 60 secondes.
  int64 expiration_timestamp = 2;
  // Écho du service cible pour lequel ce nonce a été émis.
  string service_cible = 3;
}

// Demande de vérification de la preuve à divulgation nulle de connaissance (ZKP)
message DemandeVerification {
  string utilisateur_id = 1;
  bytes preuve_zkp = 2;            // Preuve Groth16 sérialisée en JSON (pi_a, pi_b, pi_c), transmise telle quelle au consensus
  string nonce = 3;                // Nonce anti-rejeu validé
  int64 timestamp = 4;             // Horodatage de la requête
  string service_cible = 5;        // Service ou site demandeur
  string appareil_signature = 6;   // Signature matérielle ou d'appareil optionnelle
  // Signaux publics ZKP (4 valeurs, ordre strict) :
  //   [0] engagementAttendu  — Poseidon hash du vecteur de référence (entier BN254)
  //   [1] seuilMax           — Distance maximale tolérée (entier BN254)
  //   [2] nonceHi            — 128 bits de poids fort du nonce (nonce >> 128)
  //   [3] nonceLo            — 128 bits de poids faible du nonce (nonce & 0xFFFF...FFFF)
  // nonceHi et nonceLo lient cryptographiquement la preuve à ce challenge unique.
  repeated string public_signals = 7;
}

// Détail d'un vote individuel reçu par le coordinateur
message DetailVote {
  string noeud_id = 1;
  bool vote_pour = 2;
  string raison = 3;
}

// Réponse renvoyée après vérification de la preuve ZKP
message ReponseVerification {
  bool accepte = 1;
  string raison_refus = 2; // Raison du refus (vide si accepté)
  string token = 3; // Jeton de session / JWT (fourni uniquement si accepté)
  int64 score_anomalie = 4; // Score de détection de fraude / anomalie
  string coordinateur_id = 5; // Identifiant du nœud coordinateur ayant orchestré le consensus
  repeated DetailVote votes_recus = 6; // Votes individuels réellement reçus (initiateur + pairs)
  int32 nb_votes_pour = 7; // Nombre total de votes positifs
  int32 nb_votes_contre = 8; // Nombre total de votes négatifs
  repeated string noeuds_indisponibles = 9; // Identifiants des nœuds n'ayant pas répondu
  int32 seuil_requis = 10; // Seuil de majorité requis
}

// Demande d'enregistrement ou de mise à jour d'un engagement de référence
message DemandeEnregistrementEngagement {
  string utilisateur_id = 1;
  string commitment = 2;
  int64 timestamp = 3;
  int64 version = 4;
}

// Réponse d'enregistrement d'un engagement
message ReponseEnregistrementEngagement {
  bool succes = 1;
  string message = 2;
}

// Demande de révocation d'un engagement
message DemandeRevocationEngagement {
  string utilisateur_id = 1;
  string raison = 2;
  int64 timestamp = 3;
}

// Réponse de révocation d'un engagement
message ReponseRevocationEngagement {
  bool succes = 1;
  string message = 2;
}

// Entrée d'engagement pour la synchronisation par lots
message EntreeEngagementSync {
  string utilisateur_id = 1;
  string commitment = 2;
  string statut = 3; // "actif" ou "revoque"
  int64 timestamp = 4;
  int64 version = 5;
  string raison = 6;
}

// Demande de synchronisation d'engagements (rattrapage)
message DemandeSyncEngagements {
  repeated EntreeEngagementSync engagements = 1;
}

// Réponse de synchronisation d'engagements
message ReponseSyncEngagements {
  bool succes = 1;
  int32 nb_synchronises = 2;
  string message = 3;
}

