# Configuration Docker Compose du réseau FaceIn
# Comprend les noeuds de vérification distribués, l'API backend et le frontend.
# Les trois services ci-dessous construisent la même image depuis le contexte
# ./nodes, avec le Dockerfile node/Dockerfile. Ce qui les différencie, c'est
# uniquement leur configuration via variables d'environnement.
#
# Ajouter un 4e ou 5e noeud pour une démo = ajouter un bloc de plus
# ici, sans toucher au code.

services:
  node-a:
    build:
      context: ./nodes
      dockerfile: node/Dockerfile
    container_name: node-a
    # Doit dépasser le timeout heartbeat (3 s dans noeuds.yaml), avec marge
    # pour terminer les appels en cours et arrêter le serveur gRPC.
    stop_grace_period: 10s
    environment:
      - NODE_ID=node-a
      - NODE_PORT=50051
      - PEERS=node-b:50052,node-c:50053
    ports:
      - "50051:50051"
    networks:
      - reseau-verification

  node-b:
    build:
      context: ./nodes
      dockerfile: node/Dockerfile
    container_name: node-b
    # Doit dépasser le timeout heartbeat (3 s dans noeuds.yaml), avec marge
    # pour terminer les appels en cours et arrêter le serveur gRPC.
    stop_grace_period: 10s
    environment:
      - NODE_ID=node-b
      - NODE_PORT=50052
      - PEERS=node-a:50051,node-c:50053
    ports:
      - "50052:50052"
    networks:
      - reseau-verification

  node-c:
    build:
      context: ./nodes
      dockerfile: node/Dockerfile
    container_name: node-c
    # Doit dépasser le timeout heartbeat (3 s dans noeuds.yaml), avec marge
    # pour terminer les appels en cours et arrêter le serveur gRPC.
    stop_grace_period: 10s
    environment:
      - NODE_ID=node-c
      - NODE_PORT=50053
      - PEERS=node-a:50051,node-b:50052
    ports:
      - "50053:50053"
    networks:
      - reseau-verification

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: facein-api
    ports:
      - "8000:8000"
    depends_on:
      - node-a
      - node-b
      - node-c
    networks:
      - reseau-verification

  frontend:
    image: python:3.12-slim
    container_name: facein-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: python -m http.server 3000
    ports:
      - "3000:3000"
    networks:
      - reseau-verification

networks:
  reseau-verification:
    driver: bridge
