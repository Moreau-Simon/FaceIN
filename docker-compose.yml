# Configuration Docker Compose du réseau FaceIn
# Comprend les noeuds de vérification distribués, l'API backend et le frontend.

services:
  node-a:
    build:
      context: ./nodes
      dockerfile: node/Dockerfile
    container_name: node-a
    environment:
      - NODE_ID=node-a
      - NODE_PORT=50051
      - PEERS=node-b:50052,node-c:50053
    ports:
      - "50051:50051"
    networks:
      - reseau-verification

  node-b:
    build:
      context: ./nodes
      dockerfile: node/Dockerfile
    container_name: node-b
    environment:
      - NODE_ID=node-b
      - NODE_PORT=50052
      - PEERS=node-a:50051,node-c:50053
    ports:
      - "50052:50052"
    networks:
      - reseau-verification

  node-c:
    build:
      context: ./nodes
      dockerfile: node/Dockerfile
    container_name: node-c
    environment:
      - NODE_ID=node-c
      - NODE_PORT=50053
      - PEERS=node-a:50051,node-b:50052
    ports:
      - "50053:50053"
    networks:
      - reseau-verification

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: facein-api
    ports:
      - "8000:8000"
    depends_on:
      - node-a
      - node-b
      - node-c
    networks:
      - reseau-verification

  frontend:
    image: python:3.12-slim
    container_name: facein-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: python -m http.server 3000
    ports:
      - "3000:3000"
    networks:
      - reseau-verification

networks:
  reseau-verification:
    driver: bridge
